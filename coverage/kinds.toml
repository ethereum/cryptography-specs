# The models and the refinement modules of ARCHITECTURE.md "Three kinds of content".
#
# A model is listed by a module prefix: the module of that name and every module under it.
# A refinement module is a property module that states a refinement theorem, or uses one in a proof.
# It is listed by its full name.
# Among the property modules, only a refinement module may import a model directly.
# scripts/check_layers.py reads this file.
# It fails on a property module that imports a model directly but is not listed here.
# It also fails on a model that names no module, or that sits outside a Proofs directory.
# It fails on a refinement entry that does not exist, is of the wrong kind, or reaches no model.
# A module that only gathers imports, an aggregator and a model are exempt from the rule.
# An import listed in scripts/check_layers_baseline.txt passes, each one with its reason.

models = [
  # Casper FFG, LMD-GHOST, the payload tree of Gloas, the network and the stake.
  "EthLib.Consensus.Proofs.Models",
  # Keccak-f[1600] over bit vectors.
  "EthLib.Cryptography.Proofs.Models",
]

